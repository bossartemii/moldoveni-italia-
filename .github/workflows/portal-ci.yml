name: Portal CI

on:
  push:
    paths:
      - "portal/**"
      - ".github/workflows/portal-ci.yml"
  pull_request:
    paths:
      - "portal/**"
      - ".github/workflows/portal-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build portal
        run: npm run build
